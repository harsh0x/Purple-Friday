version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/purple-friday"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    ignore:
      # Keep framework and major versions strictly pinned to project specification
      - dependency-name: "next"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/node"
